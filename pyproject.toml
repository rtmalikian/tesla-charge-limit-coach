[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-charge-limit-coach"
version = "0.1.0"
description = "Automatically drops your Tesla's charge limit back to 80% when you get home from a road trip"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "charge-limit", "battery-health", "road-trip", "home-automation"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
tcc-limit = "tesla_charge_limit_coach.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-charge-limit-coach"
Issues = "https://github.com/rtmalikian/tesla-charge-limit-coach/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
